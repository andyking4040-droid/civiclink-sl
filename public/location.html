<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CivicLINK Location</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .wa-float {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #25D366;
      color: #fff;
      padding: 0.75rem 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.45);
    }
    .wa-float:active { transform: scale(0.97); }
    .wa-float svg { width: 28px; height: 28px; fill: #fff; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="ask-banner">
    ASK&KNOW BEFORE YOU GO
    <small>You scanned a CivicLINK QR code</small>
  </div>

  <main class="container">
    <div style="text-align:right;margin:0.5rem 0;">
      <div id="google_translate_element"></div>
    </div>
    <div id="app">
      <p class="muted" style="text-align:center;padding:3rem 0;">Loading...</p>
    </div>
  </main>

  <div id="waBtn"></div>

  <footer class="footer">
    CivicLINK · ACOSAT Digital<br>
    Download. Print. Paste. Share.
  </footer>

  <script>
    const slug = location.pathname.split("/l/")[1];

    function waLink(num) {
      // Strip spaces, dashes, keep digits; ensure country code
      let n = String(num).replace(/[^\d+]/g, "");
      if (n.startsWith("+")) n = n.slice(1);
      if (n.startsWith("0")) n = "232" + n.slice(1); // Sierra Leone local format
      return "https://wa.me/" + n;
    }

    async function load() {
      const res = await fetch("/api/location/" + slug);
      const data = await res.json();
      const el = document.getElementById("app");
      if (!res.ok) {
        el.innerHTML = `<div class="card"><p class="error">${data.error || "Not found"}</p>
          <a href="/" class="btn btn-outline">Back to search</a></div>`;
        return;
      }
      const l = data.location;
      el.innerHTML = `
        <div class="loc-header">
          <div class="loc-type">${l.type}</div>
          <h1 class="loc-name">${l.name}</h1>
          ${l.is_verified ? '<div class="verified">✓ Verified on CivicLINK</div>' : ''}
        </div>
        <div class="card">
          ${l.address ? `<div class="detail-row"><span class="detail-label">Address</span><span>${l.address}</span></div>` : ''}
          ${l.phone ? `<div class="detail-row"><span class="detail-label">Phone</span><span><a href="tel:${l.phone}">${l.phone}</a></span></div>` : ''}
          ${l.hours ? `<div class="detail-row"><span class="detail-label">Hours</span><span>${l.hours}</span></div>` : ''}
          ${l.services ? `<div class="detail-row"><span class="detail-label">Services</span><span>${l.services}</span></div>` : ''}
          ${l.description ? `<div class="detail-row"><span class="detail-label">About</span><span>${l.description}</span></div>` : ''}
        </div>
        <p class="muted" style="text-align:center;margin-top:1.5rem;">
          ASK&KNOW BEFORE YOU GO<br>
          <a href="/">Search more places</a>
        </p>
      `;
      document.title = l.name + " – CivicLINK";

      // WhatsApp floating button
      const waNum = l.whatsapp || l.phone;
      if (waNum) {
        document.getElementById("waBtn").innerHTML = `
          <a class="wa-float" href="${waLink(waNum)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Chat on WhatsApp
          </a>`;
      }
    }
    load();
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,fr,pt,ar',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
